name: school_bell
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: 3.3.4
  flutter: 3.19.6

dependencies:
  flutter:
    sdk: flutter
  android_alarm_manager_plus: 4.0.4
  audioplayers: 6.0.0
  editable_number_picker:
    path: ../editable_number_picker/
  file_picker: 8.0.5
  flutter_local_notifications: 17.2.1+2
  flutter_svg: 2.0.10+1
  fluttertoast: 8.2.6
  in_app_update: 4.2.3
  package_info_plus: 8.0.1
  provider: 6.1.2
  shared_preferences: 2.2.3
  url_launcher: 6.3.0
  vector_graphics: 1.1.11+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  flutter_oss_licenses: 3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
    - assets/character/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900
